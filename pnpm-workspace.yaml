packages:
  - packages/*

# pnpm holds back any version younger than a day by default. Our own packages are released
# and used by other repositories on the same day, so this repository takes them at once.
minimumReleaseAge: 0

# Packages with an install script: true lets pnpm run it, false blocks it. The compiler the tests
# run on and eslint's module resolver are listed in every repository; the value is the repository's.
allowBuilds:
  '@swc/core': true
  unrs-resolver: true

# minimatch below 11.0.1 has a denial of service (GHSA-g3hv-75wg-m249). mocha, test-exclude (c8)
# and dpdm still ask for minimatch 10 and glob 13, which do not work with minimatch 11; glob 14
# does. Dev tools only: no published package depends on either. Remove once they move on.
overrides:
  glob@13: ^14.0.6
  minimatch@>=7 <11.0.1: ^11.0.9
