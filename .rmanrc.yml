extends: '@panates/rman-preset'

# Install, sync the lockfile and publish with pnpm.
packageManager:
  node: pnpm

# All packages release together, under one version and one `v*` tag.
group: true

version:
  # Bump every package in the group, not only the ones that changed.
  cascade: group
  # Every release is a beta (1.0.0-beta.1, 1.0.0-beta.2, ...). Remove this line, and
  # `publish.npm.latestPrereleases` below, for 1.0.0.
  preid: beta

publish:
  npm:
    # Until 1.0.0 the betas are the releases: each goes to `latest`, so a plain `npm install`
    # gets the newest. Remove this with `version.preid` above.
    latestPrereleases: [beta]

changelog:
  # One changelog for the whole release, at the repository root.
  groupBy: group
